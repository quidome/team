name: Release

# A release names the images that main already checked, built and tested for the tagged commit
# (sha-<commit>, made by Publish only after Check and Build passed); nothing is
# built (docs/decisions/0010-release-only-checked-images.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tested images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # sha-<commit> exists only when Check and Build both passed on main (Publish makes it).
          sha="$IMAGE:sha-${GITHUB_SHA::7}"
          for name in "$sha" "$sha-migration"; do
            if ! docker buildx imagetools inspect "$name" >/dev/null 2>&1; then
              echo "::error::No checked image for commit ${GITHUB_SHA::7} ($name). Wait until the run on main has passed, then tag again."
              exit 1
            fi
          done
          # Migration first, as in Publish.
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME-migration" "$sha-migration"
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$sha"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}'
