name: Release

# A release names the images that main already built and tested for the tagged commit; nothing is
# built (docs/decisions/0009-pipeline-stages-and-release-by-renaming.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tested images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sha="sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$IMAGE:$sha" >/dev/null 2>&1; then
            echo "::error::No image for commit ${GITHUB_SHA::7}. Wait until the run on main has passed, then tag again."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:$sha"
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME-migration" "$IMAGE:$sha-migration"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}'
