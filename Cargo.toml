[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.86"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
# Only line numbers, no variable information: small rebuilds took 10 s instead of 16 s
# (benchmarks/nimbus-mold-line-tables-2026-10-25.txt). For a debugger, build once with
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"
